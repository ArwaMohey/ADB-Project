server {
    listen 80;
    server_name localhost;

    # ── Serve static frontend files ──────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Handle client-side navigation (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy /api/* → Express backend ───────────────────────
    # Using the Docker service name "backend" as the upstream host.
    # This means the browser never makes a cross-origin request —
    # all traffic goes through Nginx on port 80.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Proxy /health → Express backend ──────────────────────
    location /health {
        proxy_pass http://backend:5000/health;
    }
}
